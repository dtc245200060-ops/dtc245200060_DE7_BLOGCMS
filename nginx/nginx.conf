# ============================================================
# Nginx Configuration - Reverse Proxy + SSL + Security Headers

# Ẩn phiên bản Nginx (Security Hardening)
server_tokens off;

# Upstream cho ứng dụng Blog CMS
upstream blog_app {
    server blog-app:3000;
}

# ============================================================
# HTTP -> Redirect HTTPS (port 80)
# QUAN TRỌNG: /nginx_status phải đứng TRƯỚC location / để
# nginx-prometheus-exporter gọi http://nginx:80/nginx_status
# không bị redirect sang HTTPS và tự tắt container.
# ============================================================
server {
    listen 80;
    server_name localhost;

    # ── Nginx stub_status cho nginx-prometheus-exporter ──────
    # Route này KHÔNG redirect, exporter đọc trực tiếp qua HTTP
    location /nginx_status {
        stub_status on;
        access_log off;
        allow all;
    }

    # ── Redirect tất cả traffic HTTP còn lại sang HTTPS ──────
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS Server Block (port 443)
# ============================================================
server {
    listen 443 ssl http2;
    server_name localhost;
    charset utf-8;

    # ============================================================
    # SSL Configuration
    # ============================================================
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    error_page 497 https://localhost$request_uri;

    # ============================================================
    # Security Headers (Hardening)
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ============================================================
    # Logging
    # ============================================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ============================================================
    # Reverse Proxy to Blog App
    # ============================================================
    location / {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # ============================================================
    # Nginx Status (cho Prometheus nginx-exporter - cũng expose trên HTTPS)
    # ============================================================
    location /nginx_status {
        stub_status on;
        access_log off;
        allow all;
    }

    # ============================================================
    # phpMyAdmin Proxy (truy cập qua https://localhost/phpmyadmin/)
    # ============================================================
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
