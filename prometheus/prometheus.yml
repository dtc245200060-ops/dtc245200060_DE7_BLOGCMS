# ============================================================
# Prometheus Configuration
# Thu thập metrics từ: Prometheus, cAdvisor, App, Nginx, MySQL
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'blog-cms'
    student: 'DTC245200060'

# ============================================================
# Scrape Configs
# ============================================================
scrape_configs:
  # 1. Prometheus tự giám sát chính nó
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # 2. Container metrics (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'cadvisor'

  # 3. Blog CMS Application metrics
  - job_name: 'blog-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['blog-app:3000']
        labels:
          instance: 'blog-app'

  # 4. Nginx metrics (nginx-prometheus-exporter)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          instance: 'nginx'

  # 5. MySQL metrics (mysqld-exporter)
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          instance: 'mysql'
